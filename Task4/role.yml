apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: buyer-services
  name: buyer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: owner-community-services
  name: owner
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]